name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generated code is clean
        run: |
          set -euo pipefail
          make generate
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Static checks
        run: make lint
      - name: Tests with the race detector
        run: make test-race
