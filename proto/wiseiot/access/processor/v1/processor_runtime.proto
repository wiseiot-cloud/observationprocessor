syntax = "proto3";

package wiseiot.access.processor.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kai/wiseiot/internal/access/generated/proto/processor;processor";

// ProcessorRuntimeService is served by wiz-acs-core for the runtime of Observation Processors,
// such as the Go SDK. Every call carries the metadata "authorization: Bearer <API token>", with
// an API token of the REST API that holds the processor scope. A token limited to device labels
// may open only a processor whose filter selects labels, all of them labels of the token; since a
// filter change fences the session, the check at OpenSession covers the whole session.
//
// One session at a time owns a processor and all its partitions. A session that expired, closed
// or was taken over, or that opened before a filter change, a pause or a checkpoint reset of its
// processor, no longer owns it: its Heartbeat, Read and Commit fail with session_fenced, as do
// those of a session ID that was never opened, and the runtime opens a new session.
//
// Every error that the service answers has one ErrorDetail, whose code is one of:
//
//   UNAUTHENTICATED      unauthenticated      no valid API token, for whatever reason
//   PERMISSION_DENIED    permission_denied    the API token lacks the processor scope, or
//                                            OpenSession of a processor outside its labels
//   INVALID_ARGUMENT     invalid_argument     a request field is invalid; the message names it
//   NOT_FOUND            not_found            OpenSession of an unknown processor
//   ALREADY_EXISTS       owner_active         another session owns the processor
//   FAILED_PRECONDITION  session_fenced       the session no longer owns its processor
//   FAILED_PRECONDITION  processor_paused     Read or Commit of a paused processor
//   FAILED_PRECONDITION  data_gap             Read below the hot floor, with ErrorDetail.data_gap
//   OUT_OF_RANGE         offset_out_of_range  Commit outside the checkpoint and high watermark
//   INTERNAL             internal             anything else
//
// A call that its caller cancels or whose deadline expires ends with CANCELLED or
// DEADLINE_EXCEEDED as usual.
service ProcessorRuntimeService {
  // Opens a session that owns the processor until it expires 30 s after its open or its last
  // heartbeat, closes or is fenced, with the next owner epoch. owner_active while another
  // session owns the processor.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // Keeps the session 30 s longer and answers the state of its processor.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Reads the next page of a partition: the observations after its checkpoint that match the
  // filter, in offset order, within the window of the 64 * limit offsets after the checkpoint and
  // up to the high watermark; at most limit of them, and no more than fit in 2 MiB of payload
  // and observed_at, though always the first. When the partition has nothing after the
  // checkpoint, Read first waits up to wait for new observations. data_gap while the checkpoint
  // is below the hot floor of the partition.
  rpc Read(ReadRequest) returns (ReadResponse);
  // Moves the checkpoint of a partition to offset, which is neither below the checkpoint nor
  // above the high watermark; committing the checkpoint itself changes nothing.
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Ends the session, so that another may open at once. Closing a session that no longer owns
  // its processor, or an unknown one, changes nothing.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

enum ProcessorState {
  PROCESSOR_STATE_UNSPECIFIED = 0;
  PROCESSOR_STATE_ACTIVE = 1;
  // Read and Commit fail with processor_paused; Heartbeat keeps the session.
  PROCESSOR_STATE_PAUSED = 2;
}

// How the protocol that an observation claims relates to the protocols bound to its source.
enum ProtocolStatus {
  PROTOCOL_STATUS_UNSPECIFIED = 0;
  PROTOCOL_STATUS_MATCHED = 1;
  PROTOCOL_STATUS_UNREGISTERED = 2;
  PROTOCOL_STATUS_SOURCE_UNRESOLVED = 3;
  PROTOCOL_STATUS_UNBOUND = 4;
  PROTOCOL_STATUS_MISMATCH = 5;
  // A system observation that Access itself produced, under a reserved protocol "wiz.access.*",
  // classified without protocols, routes or bindings: it has no source and no protocol
  // definition. The session events of a device under "wiz.access.session:1", whose payload
  // system/session-v1.schema.json describes, are the only system observations.
  PROTOCOL_STATUS_SYSTEM = 6;
}

message OpenSessionRequest {
  string processor_id = 1;
  // Names the runtime instance in the processor status: 1 to 128 characters of UTF-8 text
  // without control characters.
  string instance_id = 2;
}

message OpenSessionResponse {
  string session_id = 1;
  // Increases with every session of the processor.
  uint64 owner_epoch = 2;
  ProcessorState state = 3;
  // The partitions are 0 to partition_count-1.
  uint32 partition_count = 4;
  // How often the runtime heartbeats; the session expires after 30 s without one.
  google.protobuf.Duration heartbeat_interval = 5;
  // The filter of the processor, which the observations that Read returns match.
  Filter filter = 6;
}

message HeartbeatRequest {
  string session_id = 1;
}

message HeartbeatResponse {
  ProcessorState state = 1;
}

message ReadRequest {
  string session_id = 1;
  // Below partition_count.
  uint32 partition = 2;
  // 1 to 1000.
  uint32 limit = 3;
  // 0 to 30 s; absent is 0.
  google.protobuf.Duration wait = 4;
}

message ReadResponse {
  repeated Observation observations = 1;
  // The offset that commits the page: the offset of its last observation when the page is full,
  // and otherwise the end of the window, so that it also advances over windows without matches.
  uint64 next_offset = 2;
  // The offset of the newest observation of the partition when Read scanned it.
  uint64 high_watermark = 3;
}

message CommitRequest {
  string session_id = 1;
  uint32 partition = 2;
  // At most 2^63-1.
  uint64 offset = 3;
}

message CommitResponse {}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {}

// An observation matches a field when the field is empty or one of its values equals the
// observation's, and the filter when it matches every field. A filter without claimed_protocols
// therefore also selects the system observations; one with claimed_protocols selects them only
// when it lists their reserved protocol, such as "wiz.access.session:1".
message Filter {
  repeated string claimed_protocols = 1;
  repeated string protocol_definition_ids = 2;
  repeated string principal_device_ids = 3;
  repeated string gateway_group_ids = 4;
  repeated string resolved_source_device_ids = 5;
  repeated ProtocolStatus protocol_statuses = 6;
  repeated string labels = 7;
}

// A raw observation. Absent optional values are empty strings.
message Observation {
  string observation_id = 1;
  uint32 partition = 2;
  uint64 offset = 3;
  // The gateway that received a radio reception first.
  string principal_device_id = 4;
  // Set only for a radio reception.
  string gateway_group_id = 5;
  string session_id = 6;
  uint64 connection_epoch = 7;
  // The publicationId of a radio reception.
  string delivery_id = 8;
  uint32 entry_index = 9;
  string claimed_protocol = 10;
  ProtocolStatus protocol_status = 11;
  string protocol_definition_id = 12;
  string claimed_source_key = 13;
  string physical_source_key = 14;
  string resolved_source_device_id = 15;
  string resolved_source_key = 16;
  // The producer's original RFC 3339 text; Access produces that of a system observation.
  string observed_at = 17;
  google.protobuf.Timestamp received_at = 18;
  // The exact bytes of the payload JSON value.
  bytes payload = 19;
  // The label of the resolved source device at acceptance, or of the principal device for a
  // system observation; empty without one.
  string label = 20;
  // The tags of the same device at acceptance; empty without.
  map<string, string> tags = 21;
}

// The detail of every error status.
message ErrorDetail {
  // The machine code of the error, as the service comment lists.
  string code = 1;
  // Set for data_gap.
  DataGap data_gap = 2;
}

// The checkpoint of a partition is below its hot floor: the observations after the checkpoint up
// to the hot floor were deleted from hot storage. Reads of the partition fail until an operator
// resets the checkpoints over REST.
message DataGap {
  uint32 partition = 1;
  uint64 checkpoint = 2;
  uint64 hot_floor = 3;
}
